<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="EduMate - automation platform for an educational organisation" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EduMate</title>
    <!-- Applies the saved light/dark choice before anything is drawn (see public/theme-init.js). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- React draws the whole application inside this one empty div. -->
    <div id="root"></div>
    <noscript>EduMate needs JavaScript to be switched on in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
