# =====================================================================
# nginx in production does two jobs:
#  1. serves the built React files (index.html, JS, CSS)
#  2. forwards every /api/... request to the Spring Boot backend on port 8080
# Because both come from the same address, the browser needs no CORS rules.
# =====================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads up to 5 MB are allowed by the backend; give nginx a little headroom.
    client_max_body_size 6m;

    # Security headers for every page (defence in depth against XSS and click-jacking).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: any unknown path (e.g. /hall-ticket) returns index.html, and React picks the page.
    location / {
        try_files $uri /index.html;
    }
}
