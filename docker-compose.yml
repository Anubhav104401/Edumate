# =====================================================================
# The whole EduMate system in one command:   docker compose up --build
# Then open http://localhost:3000
#
#   browser --> frontend (nginx, port 3000) --/api--> backend (port 8080)
#                                                      |-> postgres (port 5432)
#                                                      |-> redis    (port 6379)
# Secrets come from a .env file next to this one (copy .env.example to .env).
# =====================================================================
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edumate
      POSTGRES_USER: ${DB_USER:-edumate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edumate}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-edumate} -d edumate"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/edumate
      DB_USER: ${DB_USER:-edumate}
      DB_PASSWORD: ${DB_PASSWORD:-edumate}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      PAYMENT_GATEWAY_SECRET: ${PAYMENT_GATEWAY_SECRET:?Set PAYMENT_GATEWAY_SECRET in .env}
      DEMO_SEED: ${DEMO_SEED:-true}
      DEMO_EXPOSE_OTP: ${DEMO_EXPOSE_OTP:-true}
    volumes:
      - uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  uploads:
